[project]
name = "vla-eval-stats"
version = "0.1.0"
description = "How many rollouts? A statistically rigorous evaluation of VLA policies on LIBERO"
authors = [{ name = "Nicholas Dreesen" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[libero,smolvla,pi,evaluation]==0.6.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "pandas>=2.0",
    "pyarrow>=21",
    "matplotlib>=3.10",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
